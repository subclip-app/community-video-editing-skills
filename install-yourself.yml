- slug: opus-video-prompts
  name: Opus video prompts
  repo: joeseesun/opus-video-prompts
  mirror: subclip-app/opus-video-prompts
  video: install-yourself/opus-video-prompts/preview.mp4
  category: workflow
  what: Copy-ready prompts and 54 cases of code-rendered videos.
  why: No license, and the README says every prompt and video belongs to its original author, so Subclip cannot copy or change it. Install the original yourself.
  examples:
    - file: install-yourself/opus-video-prompts/examples/example.mp4
      caption: "Our own example: An invented prompt opens a reel of moving type, a sun-hours chart and colored light."
    - file: install-yourself/opus-video-prompts/examples/kinetic-type.jpg
      caption: "Our own example: Three words slide into a tilted stack."
    - file: install-yourself/opus-video-prompts/examples/animated-chart.jpg
      caption: "Our own example: Five bars rise to show a fictional week of sunlight."
    - file: install-yourself/opus-video-prompts/examples/gradient-field.jpg
      caption: "Our own example: Bands of colored light bend across a dark field."
- slug: onetake
  name: onetake
  repo: feitangyuan/onetake
  mirror: subclip-app/onetake
  video: install-yourself/onetake/preview.mp4
  category: motion
  what: Product launch films and teasers where every beat grows out of the one before, as one continuous take.
  why: PolyForm Noncommercial 1.0.0 allows noncommercial use only (the author sells a commercial Pro licence), so Subclip cannot adapt or redistribute it. Install the original yourself.
  examples:
    - file: install-yourself/onetake/examples/example.mp4
      caption: "Our own example: A garden watering planner unfolds into a dashboard, a chart and a display in one take."
    - file: install-yourself/onetake/examples/card-to-ui.jpg
      caption: "Our own example: The watering planner card has expanded into a dashboard."
    - file: install-yourself/onetake/examples/ui-to-chart.jpg
      caption: "Our own example: The dashboard has narrowed to its weekly watering chart."
    - file: install-yourself/onetake/examples/chart-to-screen.jpg
      caption: "Our own example: The chart has opened into a freestanding garden display."
- slug: lemo-wake
  name: lemo-wake
  repo: lemomo-ai/lemo-wake
  mirror: subclip-app/lemo-wake
  video: install-yourself/lemo-wake/preview.mp4
  category: animation
  what: One picture in, a seamless loop of about five seconds out: it takes the image apart and rebuilds it in code as a short film.
  why: The code and documentation use CC BY-NC 4.0, which allows changes only for non-commercial use, so Subclip cannot adapt it. Install the original yourself.
  examples:
    - file: install-yourself/lemo-wake/examples/example.mp4
      caption: "Our own example: A sailboat, clouds and ripples move through a five-second loop."
    - file: install-yourself/lemo-wake/examples/before.jpg
      caption: "Our own example: The original flat illustration of a sailboat on a mountain lake."
    - file: install-yourself/lemo-wake/examples/after.jpg
      caption: "Our own example: The boat and clouds drift as the sun rises above the lake."
    - file: install-yourself/lemo-wake/examples/return-motion.jpg
      caption: "Our own example: The boat tilts as it sails back toward the opening pose."
