# Skills whose license does not let us adapt them. build-registry.mjs writes INSTALL_YOURSELF.md and registry.json from this file.
# gallery: only pictures whose license allows showing them (with credit).
- slug: lemo-opuscar
  name: Lemo OpusCar
  repo: lemomo-ai/lemo-opuscar
  mirror: subclip-app/lemo-opuscar
  video: install-yourself/lemo-opuscar/preview.mp4
  category: motion
  what: A toolbox of 99 film styles made in code, each a style prompt plus a demo film.
  why: The skill and style text use CC BY-NC 4.0, which allows changes only for non-commercial use, so Subclip cannot adapt it. Install the original yourself.
  gallery:
    - https://raw.githubusercontent.com/lemomo-ai/lemo-opuscar/f9e204293930952b61ba921cd8944d05f121beee/styles/art-deco/poster.jpg
    - https://raw.githubusercontent.com/lemomo-ai/lemo-opuscar/f9e204293930952b61ba921cd8944d05f121beee/styles/bauhaus-shapes/poster.jpg
  galleryCredit: Demo film posters by Lemomo (LemoLab), CC BY 4.0.
  examples:
    - file: install-yourself/lemo-opuscar/examples/example.mp4
      caption: "Our own example: Three code-drawn film styles in eight seconds."
    - file: install-yourself/lemo-opuscar/examples/art-deco.jpg
      caption: "Our own example: A gold sun sits behind a stepped Art Deco tower."
    - file: install-yourself/lemo-opuscar/examples/bauhaus.jpg
      caption: "Our own example: A circle, triangle and square overlap on a Bauhaus grid."
    - file: install-yourself/lemo-opuscar/examples/neon-noir.jpg
      caption: "Our own example: A pink sun sets behind a dark city and a neon street grid."
