    caption: "Museum night: a T. rex skeleton chases the flashlight beam like a cat chasing a laser dot."
  - file: examples/showcase-clawd-dawn.mp4
    caption: "Dawn: Clawd poses as an exhibit in a picture frame, the guard puts down his coffee, and Clawd blinks once."
