<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">Case file doc, adapted for Subclip</title>
  <defs>
    <filter id="crete" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .21  0 0 0 0 .22  0 0 0 .5 0"/>
    </filter>
    <radialGradient id="shade" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <radialGradient id="pin" cx="35%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ff5a66"/>
      <stop offset=".45" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#5a0710"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#46484c"/>
  <rect width="1600" height="900" filter="url(#crete)"/>
  <rect width="1600" height="900" fill="url(#shade)"/>
  <rect x="110" y="150" width="560" height="52" fill="#151412"/>
  <text x="132" y="186" fill="#efe7d6" font-family="Courier New, Courier, monospace" font-size="28" letter-spacing="2">CASE FILE / SOURCED, DATED</text>
  <text x="104" y="390" fill="#c8102e" font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="170" letter-spacing="-2">CASE FILE</text>
  <rect x="112" y="452" width="520" height="120" fill="#c9d400"/>
  <text x="134" y="545" fill="#141210" font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="110">DOC</text>
  <g transform="translate(1060 200) rotate(-4)">
    <rect width="470" height="300" fill="#f4efe2"/>
    <path d="M0 100H470M0 160H470M0 220H470M0 280H470" stroke="#2850a0" stroke-opacity=".25" stroke-width="2"/>
    <text x="30" y="70" fill="#141210" font-family="Impact, 'Arial Black', sans-serif" font-size="44">EXHIBIT A</text>
    <rect x="28" y="118" width="300" height="34" fill="#f2d300"/>
    <text x="30" y="145" fill="#1d1a16" font-family="Courier New, Courier, monospace" font-size="30">their own words</text>
    <text x="30" y="205" fill="#1d1a16" font-family="Courier New, Courier, monospace" font-size="30">source: outlet, date</text>
    <path d="M30 236 C 120 228 210 242 300 230" stroke="#c8102e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="235" cy="0" r="17" fill="url(#pin)"/>
  </g>
  <path d="M1295 205 Q 1150 420 900 640" stroke="#b3121f" stroke-width="5" fill="none"/>
  <rect x="0" y="0" width="1600" height="110" fill="#000"/>
  <rect x="0" y="790" width="1600" height="110" fill="#000"/>
  <text x="110" y="700" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54">Investigative cold opens built in code</text>
  <text x="110" y="855" fill="#26c9d5" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40">Adapted for Subclip</text>
  <text x="1490" y="855" fill="#efe7d6" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="end">from Tejas Makwana's case-file-doc</text>
</svg>
