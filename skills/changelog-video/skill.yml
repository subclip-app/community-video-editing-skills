allowlist:
  - code: external-provider
    reason: HeyGen is the author of the open-source HyperFrames skill; HeyGen, ElevenLabs and OpenAI Whisper appear only in the kept upstream files as the original voice and timing tools, which this adaptation replaces with Subclip voices and local transcription. Nothing calls them.
  - code: html-injection
    file: references/subclip-build.md
    reason: The layer skeleton is example HyperFrames source (a pinned GSAP script tag and a timeline) that the agent passes to add_runtime_layer; it is not an instruction to inject markup.
