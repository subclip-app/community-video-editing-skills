  <text x="128" y="587" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Adapted for Subclip</text>
  <g transform="translate(1100 330)">
    <ellipse cx="0" cy="190" rx="300" ry="70" fill="none" stroke="#26c9d5" stroke-width="5" stroke-dasharray="14 12"/>
    <path d="M0 -150L130 -75V75L0 150L-130 75V-75Z" fill="#153592"/>
    <path d="M0 -150L130 -75L0 0L-130 -75Z" fill="#3a5bc7"/>
    <path d="M0 0L130 -75V75L0 150Z" fill="#0e2468"/>
    <path d="M0 0L-130 -75V75L0 150Z" fill="#26c9d5"/>
    <g transform="translate(250 180)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#1a202c"/><circle cx="52" cy="0" r="18" fill="#1a202c"/><circle cx="52" cy="0" r="8" fill="#26c9d5"/></g>
  </g>
  <rect x="90" y="740" width="1420" height="90" rx="12" fill="#eef2fb" stroke="#c9d3ec" stroke-width="2"/>
  <rect x="110" y="756" width="520" height="58" rx="8" fill="url(#g)"/>
