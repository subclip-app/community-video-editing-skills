<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Blender to Subclip, adapted for Subclip</title>
  <desc id="d">A 3D cube with a camera path and a timeline strip with a rendered clip.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#153592"/><stop offset="1" stop-color="#26c9d5"/></linearGradient></defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="14" fill="url(#g)"/>
  <text x="90" y="170" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="5" fill="#153592">COMMUNITY SKILLS / 3D</text>
  <text x="86" y="300" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" fill="#153592">Blender</text>
  <text x="86" y="420" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" fill="#26c9d5">to Subclip</text>
  <text x="92" y="490" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#4a5568">Build a short 3D shot, render it, edit it.</text>
