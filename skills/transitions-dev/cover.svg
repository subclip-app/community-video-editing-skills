<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <rect x="96" y="110" width="252" height="52" rx="26" fill="#153592"/>
    <text x="222" y="144" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Adapted for Subclip</text>
    <text x="96" y="286" font-size="88" font-weight="800" fill="#0f1730">transitions-dev</text>
    <text x="96" y="366" font-size="44" font-weight="600" fill="#153592">UI transitions for SaaS videos</text>
    <text x="96" y="438" font-size="30" fill="#5b6684">Pick one per state change, build it as a</text>
    <text x="96" y="480" font-size="30" fill="#5b6684">seekable layer, polish it frame by frame</text>
    <g font-size="22" font-weight="600" fill="#153592">
      <rect x="96" y="560" width="190" height="48" rx="24" fill="#e8fafc"/><text x="191" y="592" text-anchor="middle">Tabs sliding</text>
      <rect x="300" y="560" width="230" height="48" rx="24" fill="#e8fafc"/><text x="415" y="592" text-anchor="middle">Modal open / close</text>
      <rect x="96" y="624" width="190" height="48" rx="24" fill="#e8fafc"/><text x="191" y="656" text-anchor="middle">To-do reorder</text>
      <rect x="300" y="624" width="230" height="48" rx="24" fill="#e8fafc"/><text x="415" y="656" text-anchor="middle">Toast open / close</text>
    </g>
    <text x="96" y="790" font-size="24" fill="#7a849e">From transitions.dev by Jakub Antalik</text>
    <!-- app window -->
    <rect x="828" y="150" width="680" height="560" rx="22" fill="#f6f8fc" stroke="#dde3ee" stroke-width="2"/>
    <rect x="829" y="151" width="678" height="34" rx="20" fill="#eceff7"/>
    <circle cx="852" cy="168" r="6" fill="#cfd6e4"/><circle cx="872" cy="168" r="6" fill="#cfd6e4"/><circle cx="892" cy="168" r="6" fill="#cfd6e4"/>
    <text x="856" y="232" font-size="26" font-weight="700" fill="#0f1730">My tasks</text>
    <rect x="1186" y="206" width="294" height="38" rx="11" fill="#e6eaf3"/>
    <rect x="1284" y="210" width="94" height="30" rx="8" fill="#ffffff"/>
    <text x="1235" y="231" font-size="16" font-weight="600" fill="#5b6684" text-anchor="middle">Board</text>
    <text x="1331" y="231" font-size="16" font-weight="600" fill="#153592" text-anchor="middle">List</text>
    <text x="1429" y="231" font-size="16" font-weight="600" fill="#5b6684" text-anchor="middle">Timeline</text>
    <g font-size="18" font-weight="600" fill="#18223f">
      <rect x="856" y="270" width="624" height="58" rx="12" fill="#ffffff" stroke="#e3e7f0"/><text x="890" y="306">Write launch announcement</text>
      <rect x="856" y="340" width="624" height="58" rx="12" fill="#ffffff" stroke="#e3e7f0"/><text x="890" y="376">Design onboarding checklist</text>
      <rect x="856" y="410" width="624" height="58" rx="12" fill="#ffffff" stroke="#e3e7f0"/><text x="890" y="446">Review pricing page copy</text>
    </g>
    <!-- lifted row -->
    <g transform="translate(846 482) rotate(-1.2)">
      <rect x="0" y="0" width="640" height="62" rx="12" fill="#ffffff" stroke="#26c9d5" stroke-width="3"/>
      <text x="44" y="39" font-size="18" font-weight="700" fill="#18223f">Record product demo</text>
      <rect x="520" y="16" width="80" height="30" rx="15" fill="#e3faf4"/><text x="560" y="37" font-size="15" font-weight="600" fill="#0f8a6e" text-anchor="middle">Video</text>
    </g>
    <!-- toast -->
    <rect x="1170" y="600" width="310" height="70" rx="14" fill="#0f1730"/>
    <circle cx="1206" cy="635" r="16" fill="#26c9d5"/>
    <path d="M1198 635 l6 6 l11 -12" fill="none" stroke="#0b1b4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1236" y="632" font-size="18" font-weight="700" fill="#ffffff">Task created</text>
    <text x="1236" y="655" font-size="14" fill="#aeb8d0">Ship onboarding emails</text>
    <!-- cursor -->
    <path d="M1300 520 l0 34 l9 -8 l6 13 l6 -3 l-6 -12 l12 0 z" fill="#0f1730" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
