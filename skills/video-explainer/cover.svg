<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Video explainer</title><desc id="desc">Three explainer modes: a motion route map, an illustrated sun and a 3D cube, with a payment clock.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#17233f"/><stop offset="1" stop-color="#0B0B0D"/></radialGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#ffffff10" stroke-width="2"/></pattern>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="70" y="62" width="300" height="52" rx="26" fill="#15161B" stroke="#3B82F6" stroke-width="3"/>
<text x="220" y="97" text-anchor="middle" font-size="26" font-weight="700" fill="#F8FAFC">Adapted for Subclip</text>
<text x="70" y="218" font-size="104" font-weight="800" fill="#F8FAFC">Video explainer</text>
<text x="74" y="276" font-size="36" font-weight="600" fill="#94A3B8">Any topic to a 60 second film. Pick a mode.</text>
<rect x="1230" y="62" width="300" height="140" rx="26" fill="#15161B" stroke="#10B981" stroke-width="3"/>
<text x="1258" y="100" font-size="20" font-weight="700" fill="#94A3B8" letter-spacing="3">PAYMENT CLOCK</text>
<text x="1256" y="172" font-size="70" font-weight="800" fill="#10B981">2.00 s</text>
<!-- panel 1 motion -->
<rect x="70" y="340" width="460" height="470" rx="30" fill="#15161B" stroke="#ffffff22" stroke-width="3"/>
<path d="M130 640 Q190 470 300 500 T470 450" fill="none" stroke="#3B82F6" stroke-width="9" stroke-linecap="round"/>
<path d="M130 640 Q190 470 300 500 T470 450" fill="none" stroke="#10B981" stroke-width="9" stroke-linecap="round" stroke-dasharray="120 900"/>
<circle cx="130" cy="640" r="30" fill="#1E2028" stroke="#ffffff40" stroke-width="4"/>
<circle cx="300" cy="500" r="36" fill="#1E2028" stroke="#3B82F6" stroke-width="5"/>
<circle cx="470" cy="450" r="36" fill="#1E2028" stroke="#F59E0B" stroke-width="5"/>
<rect x="236" y="410" width="128" height="48" rx="14" fill="#1E2028" stroke="#3B82F6" stroke-width="3"/>
<rect x="252" y="426" width="18" height="16" rx="3" fill="#F59E0B"/>
<text x="282" y="443" font-size="24" font-weight="800" fill="#F8FAFC">YES</text>
<text x="300" y="770" text-anchor="middle" font-size="44" font-weight="800" fill="#F8FAFC">Motion</text>
<!-- panel 2 illustrated -->
<rect x="570" y="340" width="460" height="470" rx="30" fill="#0D162B" stroke="#ffffff22" stroke-width="3"/>
<g fill="#ffffff" opacity=".8"><circle cx="630" cy="400" r="3"/><circle cx="700" cy="440" r="2"/><circle cx="960" cy="410" r="3"/><circle cx="890" cy="470" r="2"/><circle cx="640" cy="520" r="2"/></g>
<g stroke="#F59E0B" stroke-width="12" stroke-linecap="round"><line x1="878" y1="520" x2="908" y2="520"/><line x1="868" y1="559" x2="894" y2="574"/><line x1="839" y1="588" x2="854" y2="614"/><line x1="800" y1="598" x2="800" y2="628"/><line x1="761" y1="588" x2="746" y2="614"/><line x1="732" y1="559" x2="706" y2="574"/><line x1="722" y1="520" x2="692" y2="520"/><line x1="732" y1="481" x2="706" y2="466"/><line x1="761" y1="452" x2="746" y2="426"/><line x1="800" y1="442" x2="800" y2="412"/><line x1="839" y1="452" x2="854" y2="426"/><line x1="868" y1="481" x2="894" y2="466"/></g>
<circle cx="800" cy="520" r="62" fill="#FCD34D"/>
<path d="M752 512 q48 -26 96 0" fill="none" stroke="#ffffff70" stroke-width="10" stroke-linecap="round"/>
<circle cx="780" cy="515" r="7" fill="#18181B"/><circle cx="820" cy="515" r="7" fill="#18181B"/>
<path d="M786 544 q14 12 28 0" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>
<path d="M620 660 q90 -40 180 0 t180 0" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity=".8"/>
<text x="800" y="770" text-anchor="middle" font-size="44" font-weight="800" fill="#F8FAFC">Illustrated</text>
<!-- panel 3 3d -->
<rect x="1070" y="340" width="460" height="470" rx="30" fill="#15161B" stroke="#ffffff22" stroke-width="3"/>
<path d="M1300 420 L1410 480 L1300 540 L1190 480 Z" fill="#60A5FA"/>
<path d="M1190 480 L1300 540 L1300 670 L1190 610 Z" fill="#1D4ED8"/>
<path d="M1410 480 L1300 540 L1300 670 L1410 610 Z" fill="#2563EB"/>
<ellipse cx="1300" cy="690" rx="140" ry="22" fill="#000000" opacity=".45"/>
<rect x="1360" y="400" width="140" height="44" rx="22" fill="#F8FAFC"/>
<text x="1430" y="430" text-anchor="middle" font-size="22" font-weight="800" fill="#0B0B0D">ONE TAKE</text>
<text x="1300" y="770" text-anchor="middle" font-size="44" font-weight="800" fill="#F8FAFC">3D</text>
<text x="70" y="862" font-size="24" font-weight="600" fill="#94A3B8">From petergyang/video-explainer by Peter Yang, MIT</text>
</g>
</svg>
