allowlist:
  - code: html-injection
    file: references/scene-kit.md
    reason: The template and kit are the source of a HyperFrames scene layer that the agent checks with validate_runtime_layer_source before add_runtime_layer; the script tags are layer source, not instructions to inject markup.
  - code: prompt-injection
    file: upstream/archify/references/explainer-authoring.md
    reason: "The match is the original's honesty rule: do not tell the user a local link is clickable unless you saw it work. It asks for less hidden behavior, not more; the upstream file is kept as published."
  - code: external-provider
    reason: The only matches name OpenAI as a brand mark notice in the original THIRD_PARTY_NOTICES.md and Codex CLI issue links in the upstream text; no outside AI service is called.
