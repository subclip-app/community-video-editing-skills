allowlist:
  - code: prompt-injection
    file: reference/critique.md
    reason: "Upstream text asks to show the readable trend line instead of a helper's raw JSON; nothing is hidden from the user, and that helper is not shipped here."
  - code: prompt-injection
    file: reference/new-work.md
    reason: "Upstream text says to skip settled facts but NOT the confirmation; it requires asking the user before implementation."
  - code: html-injection
    file: reference/critique.md
    reason: "Upstream browser-overlay step mentions appending a script tag to the creator's own dev page; the overlay runtime is not shipped and video mode never uses it."
  - code: hidden-text
    file: reference/degraded/asset-producer.md
    reason: "Upstream build marker comment saying the file is generated; the visible text that follows tells the agent to disclose the inline substitution to the user."
