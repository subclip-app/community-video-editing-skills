name: Submit a skill
description: Propose a video editing skill for the Subclip community directory.
title: '[Skill] '
body:
  - type: input
    id: name
    attributes:
      label: Skill name
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Submission path
      options:
        - Written for Subclip
        - Convert an existing skill
        - Install it yourself link only
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Original GitHub link
      description: Link to the source folder or repository, if there is one.
  - type: input
    id: license
    attributes:
      label: License and author
      description: State the license identifier and original author, or say no license.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What does it make?
      description: Describe the workflow, intended creator and sample output.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Subclip test and conversion needs
      description: Which tools does it use? What did you test? What still needs conversion?
  - type: checkboxes
    id: terms
    attributes:
      label: Submission checks
      options:
        - label: I read CONTRIBUTING.md and will keep the original LICENSE and credits.
          required: true
        - label: If the license does not allow changes and commercial use, this proposal is only for INSTALL_YOURSELF.md.
          required: true
